services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend:/app

  news-poller:
    build: ./backend
    command: python -m app.workers.news_poller
    healthcheck:
      disable: true
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: development
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
